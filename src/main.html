<div id="ui-wrapper">
<div id="floating-btn">🐸</div>
<div id="container">
  <div id="body">
    <div id="table-progress" class="table stats-grid">
      <div class="stat-card streak-card">
        <div class="stat-label">
          <svg class="stat-icon" fill="currentColor" style="color:#f37121"><use href="#ic-fire"/></svg>
          <span>Streak</span>
        </div>
        <div id="streak" class="stat-value">0</div>
      </div>
      <div class="stat-card xp-card">
        <div class="stat-label">
          <svg class="stat-icon" fill="currentColor" style="color:#34d399"><use href="#ic-star"/></svg>
          <span>Total XP</span>
        </div>
        <div id="xp" class="stat-value">0</div>
      </div>
      <div class="stat-card gem-card">
        <div class="stat-label">
          <svg class="stat-icon" fill="currentColor" style="color:#00d1ff"><use href="#ic-diamond"/></svg>
          <span>Gems</span>
        </div>
        <div id="gem" class="stat-value">0</div>
      </div>
    </div>

    <div id="action-row">
      <div class="farming-label">
        <span class="section-title">Farming Mode</span>
        <svg width="16" height="16" fill="currentColor" style="color:#475569"><use href="#ic-info"/></svg>
      </div>
      <div class="controls-row">
        <div class="select-wrap">
          <select id="select-option"></select>
          <svg class="chevron" fill="currentColor"><use href="#ic-chevron-down"/></svg>
        </div>
        <button id="start-btn">
          <svg width="20" height="20" fill="currentColor"><use href="#ic-play"/></svg>
          <span>Start</span>
        </button>
        <button id="stop-btn" hidden>
          <span class="spinner"></span>
          <span>Stop</span>
        </button>
      </div>
    </div>

  </div>

  <div id="footer">
    <div class="footer-left">
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <img id="avatar-flag" class="avatar-flag" src="https://flagcdn.com/vn.svg" alt="flag"/>
      </div>
      <span id="username" class="label">duofarmer</span>
    </div>
    <button id="settings-btn">
      <svg width="26" height="26" fill="currentColor"><use href="#ic-settings"/></svg>
    </button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-container">
  <div id="settings-menu" class="modal-content">
    <div class="modal-header">
      <span class="label">Settings</span>
      <button id="settings-close" class="modal-close">
        <svg width="20" height="20" fill="currentColor"><use href="#ic-close"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="settings-group">
        <h3>General</h3>
        <div class="setting-item">
          <span>Auto open UI onload</span>
          <input type="checkbox" id="auto-open-ui">
        </div>
        <div class="setting-item">
          <span>Auto start farming onload</span>
          <input type="checkbox" id="auto-start">
        </div>
        <div class="setting-item">
          <span>Default farming option</span>
          <select id="default-option"></select>
        </div>
        <div class="setting-item">
          <span>Hide username</span>
          <input type="checkbox" id="hide-username">
        </div>
        <div class="setting-item">
          <span>Keep screen on</span>
          <input type="checkbox" id="keep-screen-on">
        </div>
      </div>
      <div class="settings-group">
        <h3>Performance</h3>
        <div class="setting-item">
          <span>Auto stop after (min) (0 = unlimited)</span>
          <input type="number" id="auto-stop-time" min="0" max="60" value="0">
        </div>
      </div>
      <div class="settings-group">
        <h3>Advanced</h3>
        <div class="setting-item">
          <span>Get ur JWT token</span>
          <button id="get-jwt-token" class="setting-btn">Get Token</button>
        </div>
        <div class="setting-item">
          <span>Reset setting</span>
          <button id="reset-setting" class="setting-btn">Reset</button>
        </div>
      </div>
      <div class="settings-group">
        <h3>Others</h3>
        <div class="setting-item">
          <span>Telegram</span>
          <a href="https://t.me/duofarmer" target="_blank">Here</a>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <span></span>
      <button id="save-settings" class="save-btn">Save</button>
    </div>
  </div>
</div>

</div>
